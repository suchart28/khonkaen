<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบติดตามฝนตก เมืองขอนแก่น</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Font: Kanit (ทันสมัย อ่านง่าย) -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      font-family: 'Kanit', sans-serif; 
      color: #0f172a;
    }
    #map { height: 100vh; width: 100%; z-index: 1; }

    /* การ์ดควบคุมสไตล์ Glassmorphism (กระจกใส ทันสมัย) */
    .dashboard-card {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      border-radius: 20px;
      padding: 20px;
      width: 340px;
      max-width: calc(100vw - 32px);
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .app-title {
      font-weight: 600;
      font-size: 16px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* กล่องสรุปสถานะจุดที่ยืนอยู่ (เน้นความเด่น อ่านง่าย) */
    .user-status-banner {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .user-status-title {
      font-size: 12px;
      color: #3b82f6;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .user-status-value {
      font-size: 15px;
      font-weight: 600;
      color: #1e3a8a;
    }

    .time-label {
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }

    /* Slider และ Controls */
    input[type=range] {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      accent-color: #2563eb;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 12px;
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-gps {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-gps:hover { background: #1d4ed8; }
    
    .btn-play {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-play:hover { background: #e2e8f0; }

    /* ปุ่มทางลัดสถานที่ */
    .landmarks-group {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .landmarks-title {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .chips-wrapper {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    /* แถบอธิบายความเข้มฝน (Legend) */
    .legend-card {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      font-size: 11px;
      color: #475569;
      border: 1px solid rgba(255,255,255,0.8);
    }
    .legend-bar {
      height: 8px;
      width: 140px;
      border-radius: 4px;
      background: linear-gradient(to right, #60a5fa, #2563eb, #7c3aed, #dc2626);
      margin-top: 4px;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- แผงควบคุม Glassmorphism UI -->
  <div class="dashboard-card">
    <div class="app-header">
      <div class="app-title">🌧️ พยากรณ์ฝนเมืองขอนแก่น</div>
    </div>

    <!-- การ์ดแจ้งสถานะจุดที่ผู้ใช้อยู่ -->
    <div class="user-status-banner" id="userBanner">
      <div class="user-status-title">📍 ตำแหน่งของคุณ</div>
      <div class="user-status-value" id="userStatusText">กดปุ่ม GPS ด้านล่างเพื่อตรวจสอบ</div>
    </div>

    <div class="time-label" id="timeLabel">กำลังดึงข้อมูลสภาพอากาศ...</div>
    <input type="range" id="timeSlider" min="0" max="23" value="0" disabled>

    <div class="btn-row">
      <button class="btn-action btn-gps" onclick="locateUser()">📍 เช็กตำแหน่งฉัน</button>
      <button class="btn-action btn-play" id="playBtn">▶ เล่นแอนิเมชัน</button>
    </div>

    <!-- ปุ่มทางลัดไปจุดสำคัญ -->
    <div class="landmarks-group">
      <div class="landmarks-title">ดูพื้นที่สำคัญในเมือง:</div>
      <div class="chips-wrapper">
        <div class="chip" onclick="flyToLandmark(16.4720, 102.8230, 'ม.ขอนแก่น')">🎓 มข.</div>
        <div class="chip" onclick="flyToLandmark(16.4322, 102.8280, 'เซ็นทรัล ขอนแก่น')">🛍️ เซ็นทรัล</div>
        <div class="chip" onclick="flyToLandmark(16.4150, 102.8350, 'บึงแก่นนคร')">🏞️ บึงแก่นนคร</div>
        <div class="chip" onclick="flyToLandmark(16.4650, 102.7840, 'สนามบิน')">✈️ สนามบิน</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Legend แสดงเฉดสีเรดาร์ -->
  <div class="legend-card">
    <div>โอกาสเกิดฝนตก (%)</div>
    <div class="legend-bar"></div>
    <div class="legend-labels">
      <span>20%</span>
      <span>50%</span>
      <span>80%</span>
      <span>100%</span>
    </div>
  </div>

  <!-- Leaflet JS & Leaflet Heatmap Plugin -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <script>
    // 1. สร้างแผนที่ตั้งศูนย์กลางขอนแก่น (ใช้โทนแผนที่ CartoDB Voyager สบายตา ทันสมัย)
    const map = L.map('map', { zoomControl: false }).setView([16.4322, 102.8236], 13);
    
    // ย้าย Zoom Control ไปไว้มุมขวาบน เพื่อไม่ให้บังแผงควบคุม
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap & CartoDB'
    }).addTo(map);

    // 2. สร้างโครงข่ายจุดความละเอียดสูงสำหรับทำ Smooth Heatmap
    const minLat = 16.36, maxLat = 16.50;
    const minLon = 102.75, maxLon = 102.90;
    const STEPS = 35; // ความละเอียดของเรดาร์

    const dLat = (maxLat - minLat) / STEPS;
    const dLon = (maxLon - minLon) / STEPS;

    let heatLayer = null;
    let forecastData = null;
    let currentHourIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    let userLocation = null;
    let userMarker = null;

    // 3. ดึงข้อมูลพยากรณ์ฝนจริงรายชั่วโมงจาก Open-Meteo API
    async function fetchRainForecast() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=16.4322&longitude=102.8236&hourly=precipitation_probability,precipitation&timezone=Asia%2FBangkok`;
        const res = await fetch(url);
        const data = await res.json();
        
        forecastData = data.hourly;
        document.getElementById('timeSlider').disabled = false;
        updateDisplay(0);
      } catch (err) {
        document.getElementById('timeLabel').innerText = "❌ โหลดข้อมูลล้มเหลว";
        console.error(err);
      }
    }

    // 4. คำนวณจุดและสร้าง Smooth Radar Layer
    function updateDisplay(hourIdx) {
      if (!forecastData) return;

      currentHourIndex = hourIdx;
      const timeStr = forecastData.time[hourIdx];
      const baseProb = forecastData.precipitation_probability[hourIdx] || 0;

      const dateObj = new Date(timeStr);
      const formattedTime = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
      const formattedDate = dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

      document.getElementById('timeLabel').innerText = `🕒 พยากรณ์เวลา: ${formattedDate} (${formattedTime})`;

      // คำนวณความเข้มฝนเป็น Smooth Heatmap Points [Lat, Lng, Intensity]
      const heatPoints = [];
      let currentUserProb = baseProb;

      for (let r = 0; r <= STEPS; r++) {
        for (let c = 0; c <= STEPS; c++) {
          const lat = minLat + r * dLat;
          const lon = minLon + c * dLon;

          // แบบจำลองทิศทางคลื่นฝนพัดผ่านเมืองให้ดูสมจริง
          const wave = Math.sin((r * 0.25) + (c * 0.25) - (hourIdx * 0.7)) * 25;
          let intensity = Math.min(100, Math.max(0, baseProb + wave)) / 100;

          if (baseProb === 0) intensity = 0;

          if (intensity > 0.1) {
            heatPoints.push([lat, lon, intensity]);
          }

          // คำนวณฝน ณ จุดที่ผู้ใช้อยู่
          if (userLocation && Math.abs(lat - userLocation.lat) < dLat && Math.abs(lon - userLocation.lng) < dLon) {
            currentUserProb = Math.round(intensity * 100);
          }
        }
      }

      // วาดชั้นเรดาร์ Smooth Heatmap ใหม่
      if (heatLayer) map.removeLayer(heatLayer);

      heatLayer = L.heatLayer(heatPoints, {
        radius: 28,
        blur: 20,
        maxZoom: 15,
        max: 1.0,
        gradient: {
          0.2: '#60a5fa', // ฟ้าอ่อน (ฝนละออง)
          0.4: '#2563eb', // น้ำเงินสด (ฝนปานกลาง)
          0.7: '#7c3aed', // ม่วง (ฝนตกหนัก)
          1.0: '#dc2626'  // แดง (ฝนตกหนักมาก)
        }
      }).addTo(map);

      // อัปเดตข้อมูลการ์ดแจ้งผู้ใช้
      if (userLocation) {
        updateUserBanner(currentUserProb, formattedTime);
      }
    }

    // 5. ระบบเช็กตำแหน่ง GPS
    function locateUser() {
      if (!navigator.geolocation) {
        alert("เบราว์เซอร์ไม่รองรับ GPS");
        return;
      }

      document.getElementById('userStatusText').innerText = "⏳ กำลังค้นหาตำแหน่ง...";

      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        userLocation = { lat, lng };

        map.flyTo([lat, lng], 14, { duration: 1.5 });

        // สร้างหมุดระบุตำแหน่งสีน้ำเงินเนียนตา
        if (userMarker) map.removeLayer(userMarker);
        
        userMarker = L.circleMarker([lat, lng], {
          radius: 8,
          fillColor: '#2563eb',
          color: '#ffffff',
          weight: 3,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map).bindPopup("<b>📍 คุณอยู่ตรงนี้</b>").openPopup();

        updateDisplay(currentHourIndex);
      }, () => {
        document.getElementById('userStatusText').innerText = "ไม่สามารถดึงตำแหน่ง GPS ได้";
      });
    }

    // 6. อัปเดตข้อความบน Banner สรุปผล
    function updateUserBanner(prob, timeStr) {
      const banner = document.getElementById('userStatusText');
      if (prob >= 70) {
        banner.innerHTML = `โอกาสฝนตก <span style="color:#dc2626">${prob}%</span> &bull; ☔ พกร่มด่วน!`;
      } else if (prob >= 40) {
        banner.innerHTML = `โอกาสฝนตก <span style="color:#2563eb">${prob}%</span> &bull; 🌦️ อาจมีฝนบางแห่ง`;
      } else {
        banner.innerHTML = `โอกาสฝนตก <span style="color:#16a34a">${prob}%</span> &bull; ☀️ อากาศสดใส`;
      }
    }

    // 7. ปุ่มทางลัดสถานที่
    function flyToLandmark(lat, lng, name) {
      map.flyTo([lat, lng], 14, { duration: 1.2 });
      L.popup().setLatLng([lat, lng]).setContent(`<b>📍 ${name}</b>`).openOn(map);
    }

    // 8. Event Listeners
    document.getElementById('timeSlider').addEventListener('input', (e) => {
      updateDisplay(parseInt(e.target.value));
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');

      if (isPlaying) {
        btn.innerText = "⏸ หยุดเล่น";
        playInterval = setInterval(() => {
          let nextHour = (currentHourIndex + 1) % 24;
          document.getElementById('timeSlider').value = nextHour;
          updateDisplay(nextHour);
        }, 1200);
      } else {
        btn.innerText = "▶ เล่นแอนิเมชัน";
        clearInterval(playInterval);
      }
    });

    // เริ่มต้นทำงาน
    fetchRainForecast();
  </script>
</body>
</html>
