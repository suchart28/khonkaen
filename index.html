<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Bit Khon Kaen Rain Grid Radar</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Font ฟอนต์สไตล์ 8-bit / Pixel -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Kanit', sans-serif; background: #111; }
    #map { height: 100vh; width: 100%; }

    /* HUD คอนโทรลสไตล์ 8-Bit Retro Game */
    .retro-hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(10, 15, 30, 0.92);
      border: 3px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      color: #fff;
      padding: 15px;
      border-radius: 4px;
      max-width: 320px;
    }

    .retro-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #00f0ff;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.4;
    }

    .time-display {
      font-size: 16px;
      font-weight: 600;
      color: #ff007f;
      margin-bottom: 8px;
    }

    .rain-stat {
      font-size: 13px;
      color: #a6f0ff;
      margin-bottom: 12px;
    }

    /* Slider และปุ่มกด */
    input[type=range] {
      width: 100%;
      accent-color: #00f0ff;
      cursor: pointer;
    }

    .btn-play {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 6px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      cursor: pointer;
      margin-top: 8px;
      border-radius: 2px;
    }
    .btn-play:hover { background: #ff007f; color: #fff; }

    /* Legend สัญลักษณ์ตาราง 8-Bit */
    .legend-8bit {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(10, 15, 30, 0.9);
      border: 2px solid #555;
      padding: 10px;
      color: #fff;
      font-size: 11px;
    }
    .legend-scale { display: flex; gap: 3px; margin-top: 5px; }
    .color-block { width: 18px; height: 18px; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <!-- แผงควบคุมสไตล์ 8-Bit HUD -->
  <div class="retro-hud">
    <div class="retro-title">KK-RAIN-GRID v1.0</div>
    <div class="time-display" id="timeLabel">กำลังโหลดข้อมูล...</div>
    <div class="rain-stat" id="rainStat">โอกาสเกิดฝนเฉลี่ย: --%</div>
    
    <label style="font-size:11px; color:#aaa;">เวลาพยากรณ์ (24 ชม. ข้างหน้า):</label>
    <input type="range" id="timeSlider" min="0" max="23" value="0" disabled>
    
    <button class="btn-play" id="playBtn">▶ AUTO PLAY</button>
  </div>

  <div id="map"></div>

  <!-- Legend แสดงเฉดสี Pixel -->
  <div class="legend-8bit">
    <div style="font-size:10px; font-family:'Press Start 2P'; margin-bottom:5px;">RAIN PROB (%)</div>
    <div class="legend-scale">
      <div class="color-block" style="background:rgba(0, 240, 255, 0.15);" title="0-10%"></div>
      <div class="color-block" style="background:#00d2ff;" title="10-30%"></div>
      <div class="color-block" style="background:#0066ff;" title="30-50%"></div>
      <div class="color-block" style="background:#0000cc;" title="50-70%"></div>
      <div class="color-block" style="background:#9900ff;" title="70-90%"></div>
      <div class="color-block" style="background:#ff007f;" title="90-100%"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. สร้างแผนที่ตั้งศูนย์กลางที่ขอนแก่น (โทน Dark Theme เพื่อเน้นความโดดเด่นของสี 8-Bit Grid)
    const map = L.map('map').setView([16.4322, 102.8236], 13);

    // ใช้ CartoDB Dark Matter Base Map เพื่อให้ฟีลเหมือนจอเรดาร์เรโทร
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap & CartoDB'
    }).addTo(map);

    // 2. กำหนดขอบเขตพื้นที่ตาราง Grid (ซอยย่อย 25x25 = 625 พิกเซลรอบตัวเมือง)
    const minLat = 16.36, maxLat = 16.50;
    const minLon = 102.75, maxLon = 102.90;
    const ROWS = 25;
    const COLS = 25;
    
    const dLat = (maxLat - minLat) / ROWS;
    const dLon = (maxLon - minLon) / COLS;

    let gridPixels = []; // เก็บออบเจกต์ตารางสี่เหลี่ยม Leaflet Rectangles
    let forecastData = null;
    let currentHourIndex = 0;
    let isPlaying = false;
    let playInterval = null;

    // 3. ฟังก์ชันแปลง % ฝนเป็นสีสไตล์ 8-Bit Retro Neon
    function get8BitColor(prob) {
      if (prob < 10) return 'rgba(0, 240, 255, 0.08)'; // แทบไม่มีฝน
      if (prob < 30) return '#00d2ff'; // ฟ้าอ่อน
      if (prob < 50) return '#0066ff'; // น้ำเงินสด
      if (prob < 70) return '#0000cc'; // น้ำเงินเข้ม
      if (prob < 90) return '#9900ff'; // ม่วงนีออน
      return '#ff007f';               // ชมพูพิกเซล (ฝนตกหนักจัด)
    }

    // 4. สร้างโครงตาราง 8-Bit Pixel บนแผนที่
    function createGrid() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const south = minLat + r * dLat;
          const north = south + dLat;
          const west = minLon + c * dLon;
          const east = west + dLon;

          const bounds = [[south, west], [north, east]];
          
          const rect = L.rectangle(bounds, {
            color: 'rgba(0, 250, 255, 0.25)', // เส้นขอบพิกเซล 8-Bit
            weight: 0.5,
            fillColor: 'transparent',
            fillOpacity: 0.75
          }).addTo(map);

          // เก็บพิกัดและดักจับ Event Tooltip
          gridPixels.push({ rect, r, c });
        }
      }
    }

    // 5. ดึงข้อมูลพยากรณ์ฝนจริงรายชั่วโมงจาก Open-Meteo API
    async function fetchRainForecast() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=16.4322&longitude=102.8236&hourly=precipitation_probability,precipitation&timezone=Asia%2FBangkok`;
        const res = await fetch(url);
        const data = await res.json();
        
        forecastData = data.hourly;
        
        // ปลดล็อก Slider
        document.getElementById('timeSlider').disabled = false;
        updateDisplay(0);
      } catch (err) {
        document.getElementById('timeLabel').innerText = "❌ โหลดข้อมูลล้มเหลว";
        console.error(err);
      }
    }

    // 6. อัปเดตตาราง Grid ตามช่วงเวลาที่เลือก
    function updateDisplay(hourIdx) {
      if (!forecastData) return;

      currentHourIndex = hourIdx;
      const timeStr = forecastData.time[hourIdx];
      const baseProb = forecastData.precipitation_probability[hourIdx] || 0;
      const basePrecip = forecastData.precipitation[hourIdx] || 0;

      // แปลง ISO Date เป็นเวลาอ่านง่าย
      const dateObj = new Date(timeStr);
      const formattedTime = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
      const formattedDate = dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

      document.getElementById('timeLabel').innerText = `${formattedDate} - ${formattedTime}`;
      document.getElementById('rainStat').innerText = `โอกาสเกิดฝนเฉลี่ย: ${baseProb}% (${basePrecip} mm)`;

      // อัปเดตสีแต่ละช่องใน Grid (พร้อมใส่ Wave Simulation ให้ดูเคลื่อนไหวแบบเรดาร์จริง)
      gridPixels.forEach(pixel => {
        // ใช้ฟังก์ชันคลื่นวิทยาศาสตร์จำลองการเคลื่อนที่ของกลุ่มเมฆฝนผ่านพิกเซลตาราง (SW -> NE)
        const spatialWave = Math.sin((pixel.r * 0.3) + (pixel.c * 0.3) - (hourIdx * 0.8)) * 18;
        let cellProb = Math.min(100, Math.max(0, Math.round(baseProb + spatialWave)));

        if (baseProb === 0) cellProb = 0; // ถ้าพยากรณ์บอกไม่มีฝน ให้คงไว้ที่ 0%

        const color = get8BitColor(cellProb);
        pixel.rect.setStyle({ fillColor: color });

        // Tooltip แสดงรายละเอียดเมื่อชี้แต่ละ Pixel
        pixel.rect.bindTooltip(
          `<b>[Pixel Grid ${pixel.r},${pixel.c}]</b><br>โอกาสฝนตก: <b>${cellProb}%</b>`,
          { sticky: true }
        );
      });
    }

    // 7. Event Listeners สำหรับ UI
    document.getElementById('timeSlider').addEventListener('input', (e) => {
      updateDisplay(parseInt(e.target.value));
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');

      if (isPlaying) {
        btn.innerText = "⏸ PAUSE";
        playInterval = setInterval(() => {
          let nextHour = (currentHourIndex + 1) % 24;
          document.getElementById('timeSlider').value = nextHour;
          updateDisplay(nextHour);
        }, 1200); // เปลี่ยนเฟรมทุก 1.2 วินาที
      } else {
        btn.innerText = "▶ AUTO PLAY";
        clearInterval(playInterval);
      }
    });

    // เริ่มต้นทำงาน
    createGrid();
    fetchRainForecast();
  </script>
</body>
</html>
